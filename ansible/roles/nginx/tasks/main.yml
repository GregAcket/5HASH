---
- name: Install Nginx on Debian systems
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Load the nginx conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Check the Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_config_check
  changed_when: false
  failed_when: nginx_config_check.rc not in [0, 1]

- name: Repair the nginx conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  register: nginx_repair
  when: nginx_config_check.rc == 1
  notify: Reload Nginx

- name: Check if nginx conf has been repaired
  ansible.builtin.debug:
    msg: "Nginx config repaired: {{ nginx_repair.changed }}"
  when: nginx_repair.changed

- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
